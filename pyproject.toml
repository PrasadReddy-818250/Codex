[project]
name = "local-frank-sql-python-gpt"
version = "0.1.0"
description = "Local Windows-first SQL/Python data engineering assistant with RAG and llama.cpp backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["assistant", "app", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
